<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mithran | Resume</title>


    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >


    <style>

        /* =========================
           GLOBAL
        ========================= */

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

            font-family: "Poppins", sans-serif;

            scroll-behavior: smooth;

        }


        

            body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255, 0, 0, 0.14),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(255, 0, 0, 0.10),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #000000 0%,
            #0d0000 35%,
            #180000 65%,
            #050000 100%
        );

    color: white;

    overflow-x: hidden;
}

        


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            width: 90%;

            max-width: 1250px;

            position: fixed;

            top: 20px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 1000;

            padding: 15px 25px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-radius: 20px;

            border:
                1px solid
                rgba(255,255,255,0.15);

            background:
                rgba(255,255,255,0.07);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 8px 32px
                rgba(0,0,0,0.4);

        }


        .logo {

            font-size: 27px;

            font-weight: 800;

            color: white;

        }


        .logo span {

            color: #ff3030;

        }


        .nav-buttons {

            display: flex;

            gap: 12px;

            align-items: center;

        }


        .nav-btn {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 10px 18px;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,0.15);

            background:
                rgba(255,255,255,0.05);

            color: white;

            text-decoration: none;

            font-size: 14px;

            transition: 0.3s ease;

        }


        .nav-btn:hover {

            background: #ff3030;

            border-color: #ff3030;

            transform: translateY(-3px);

        }


        /* =========================
           MAIN
        ========================= */

        .resume-container {

            width: 100%;

            min-height: 100vh;

            padding:
                130px 5% 50px;

            text-align: center;

        }


        /* =========================
           TITLE
        ========================= */

        .resume-title {

            margin-bottom: 25px;

        }


        .resume-title h1 {

            font-size:
                clamp(
                    2.8rem,
                    6vw,
                    4.5rem
                );

            font-weight: 800;

        }


        .resume-title h1 span {

            color: #ff3030;

        }


        .resume-title p {

            color: #aaa;

            margin-top: 8px;

            font-size: 14px;

        }


        /* =========================
           BUTTONS
        ========================= */

        .button-container {

            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 15px;

            margin-bottom: 30px;

        }


        .resume-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            padding: 13px 24px;

            border-radius: 12px;

            color: white;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            border:
                1px solid
                #ff3030;

            background: #ff3030;

            transition: 0.3s ease;

        }


        .resume-btn:hover {

            background: transparent;

            color: #ff3030;

            transform: translateY(-4px);

            box-shadow:
                0 8px 25px
                rgba(255,0,0,0.2);

        }


        .home-btn {

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid
                rgba(255,255,255,0.2);

        }


        .home-btn:hover {

            background: white;

            color: #111;

            border-color: white;

        }


        /* =========================
           PDF BOX
        ========================= */

        .pdf-box {

            width: 95%;

            max-width: 1200px;

            height: 75vh;

            margin: auto;

            padding: 8px;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #ff3030,
                    rgba(255,255,255,0.1),
                    #ff3030
                );

            box-shadow:
                0 0 40px
                rgba(255,0,0,0.2);

        }


        .pdf-inner {

            width: 100%;

            height: 100%;

            overflow: hidden;

            border-radius: 16px;

            background: #111;

        }


        iframe {

            width: 100%;

            height: 100%;

            border: none;

        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            margin-top: 30px;

            color: #777;

            font-size: 13px;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {


            .navbar {

                top: 10px;

                width: 94%;

                padding:
                    12px 15px;

            }


            .logo {

                font-size: 22px;

            }


            .nav-buttons {

                gap: 5px;

            }


            .nav-btn {

                padding:
                    8px 10px;

                font-size: 12px;

            }


            .nav-btn span {

                display: none;

            }


            .resume-container {

                padding:
                    110px 3% 30px;

            }


            .button-container {

                flex-direction: column;

            }


            .resume-btn {

                width: 90%;

            }


            .pdf-box {

                width: 100%;

                height: 70vh;

                padding: 5px;

                border-radius: 15px;

            }


            .pdf-inner {

                border-radius: 10px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">

        <div class="logo">

            Mithran<span>.</span>

        </div>


        <div class="nav-buttons">

            <a
                href="index.html"
                class="nav-btn"
            >

                <i class="fa-solid fa-house"></i>

                <span>Home</span>

            </a>


            <a
                href="index.html#contact"
                class="nav-btn"
            >

                <i class="fa-solid fa-envelope"></i>

                <span>Contact</span>

            </a>

        </div>

    </nav>



    <!-- =========================
         RESUME
    ========================= -->

    <main class="resume-container">


        <div class="resume-title">

            <h1>

                My <span>Resume</span>

            </h1>

            <p>
                View or download my professional resume
            </p>

        </div>



        <!-- BUTTONS -->

        <div class="button-container">


            <a
                href="/Portfolio/MITHRAN_RESUME.pdf"
                download
                class="resume-btn"
            >

                <i class="fa-solid fa-download"></i>

                Download Resume

            </a>


            <a
                href="index.html"
                class="resume-btn home-btn"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Back To Portfolio

            </a>

        </div>



        <!-- PDF -->

        <div class="pdf-box">

            <div class="pdf-inner">

                <iframe
                    src="/Portfolio/MITHRAN_RESUME.pdf"
                    title="Mithran Resume"
                >
                </iframe>

            </div>

        </div>


        <footer>

           

        </footer>


    </main>


</body>

</html>
